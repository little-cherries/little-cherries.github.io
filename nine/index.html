<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nine by Nine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centred column. The board is the hero; stats sit above it, tools and number pad below it. */
:root {
  --bg: #edf0f4;
  --surface: #ffffff;
  --ink: #172033;
  --muted: #5b6679;
  --line: #c3cad6;
  --line-strong: #172033;
  --accent: #2552d9;
  --accent-ink: #ffffff;
  --accent-soft: #d6e2fb;
  --same: #e2eaf9;
  --peer: #eef2f8;
  --bad: #c62f3e;
  --bad-soft: #fbdde0;
  --panel: #e1e6ee;
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141d; --surface: #172030; --ink: #e8edf6; --muted: #93a0b8;
    --line: #2c3850; --line-strong: #8fa0be; --accent: #7fa2ff; --accent-ink: #0f141d;
    --accent-soft: #29407a; --same: #22345f; --peer: #1c2638; --bad: #ff8a94;
    --bad-soft: #4a222a; --panel: #1f2a3e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141d; --surface: #172030; --ink: #e8edf6; --muted: #93a0b8;
  --line: #2c3850; --line-strong: #8fa0be; --accent: #7fa2ff; --accent-ink: #0f141d;
  --accent-soft: #29407a; --same: #22345f; --peer: #1c2638; --bad: #ff8a94;
  --bad-soft: #4a222a; --panel: #1f2a3e; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }

.app {
  width: min(100%, 520px, max(300px, calc(100svh - 330px)));
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Header: title on the left, timer and mistakes on the right */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; text-wrap: balance; }
.stats { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 500; }
.stats .warn b { color: var(--bad); }

/* Difficulty switch and New game button */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--panel); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 7px 13px; border-radius: 8px;
  font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; min-height: 34px;
}
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.ghost {
  border: 1.5px solid var(--line-strong); background: transparent; border-radius: 10px;
  padding: 7px 14px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 40px;
}

/* The 9x9 board. container-type lets digits scale with the board width (cqw units). */
.board {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  grid-template-rows: repeat(9, 1fr);
  aspect-ratio: 1;
  width: 100%;
  max-width: 100%;
  container-type: inline-size;
  background: var(--surface);
  border: 2px solid var(--line-strong);
  border-radius: 10px;
  overflow: hidden;
}
/* One cell. Thin lines everywhere; .cr / .cb add thick lines between 3x3 boxes; .ce / .be remove the outer edge. */
.cell {
  appearance: none; margin: 0; padding: 0; min-width: 0; min-height: 0;
  position: relative; background: var(--surface); color: var(--ink);
  border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  cursor: pointer; display: grid; place-items: center; font-family: var(--font-display);
}
.cell.cr { border-right: 2px solid var(--line-strong); }
.cell.cb { border-bottom: 2px solid var(--line-strong); }
.cell.ce { border-right: 0; }
.cell.be { border-bottom: 0; }
/* Highlight states, weakest to strongest: same row/column/box, same digit, selected cell. Wrong digits go red. */
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); z-index: 1; }
.cell.bad { background: var(--bad-soft); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; z-index: 2; }
.v { font-size: 5.4cqw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.cell.user .v { color: var(--accent); font-weight: 600; }
.cell.bad .v { color: var(--bad); }
/* Pencil marks: a 3x3 grid of small digits inside the cell, shown only while the cell is empty */
.nt { position: absolute; inset: 7%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
.nt i {
  visibility: hidden; font-style: normal; font-family: var(--font-mono);
  font-size: max(7px, 2.1cqw); color: var(--muted); display: grid; place-items: center; line-height: 1;
}
.nt i.on { visibility: visible; }
.cell.hasv .nt { display: none; }

/* Undo / Erase / Notes / Hint buttons */
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tool {
  border: 0; background: var(--panel); border-radius: 12px; min-height: 56px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 12px; font-weight: 500; position: relative; padding: 6px 2px;
}
.tool svg { width: 20px; height: 20px; }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tool:disabled { opacity: .4; cursor: default; }
.tool .badge {
  position: absolute; top: 5px; right: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--muted);
}
.tool[aria-pressed="true"] .badge { color: var(--accent-ink); }

/* Number pad: nine buttons in one row, each with a "remaining" counter */
.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.key {
  border: 0; background: var(--surface); border-radius: 10px; min-height: 58px; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  box-shadow: inset 0 0 0 1.5px var(--line); padding: 4px 0;
}
.key .d { font-size: 24px; font-weight: 700; line-height: 1; color: var(--accent); }
.key .n { font-family: var(--font-mono); font-size: 10px; color: var(--muted); line-height: 1; }
.key:active { background: var(--accent-soft); }
.key:disabled { opacity: .3; cursor: default; }
.tool:focus-visible, .key:focus-visible, .ghost:focus-visible, .seg button:focus-visible, .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.help { margin: 2px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
.help kbd { font-family: var(--font-mono); font-size: 11px; background: var(--panel); border-radius: 4px; padding: 1px 5px; }

/* Dialog overlay for the win, game-over and confirm messages */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: rgba(10, 14, 22, .55);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.card { background: var(--surface); color: var(--ink); border-radius: 16px; padding: 24px; width: min(100%, 340px); display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-size: 26px; letter-spacing: -0.03em; font-weight: 800; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-family: var(--font-mono); }
.facts div { background: var(--panel); border-radius: 10px; padding: 10px 6px; text-align: center; }
.facts b { display: block; font-size: 18px; font-weight: 500; color: var(--ink); }
.facts span { font-size: 11px; color: var(--muted); }
.go { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; min-height: 48px; font-size: 16px; font-weight: 700; cursor: pointer; }
.go.alt { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }

/* Slightly smaller controls on narrow phones */
@media (max-width: 420px) {
  h1 { font-size: 22px; }
  .key { min-height: 52px; }
  .key .d { font-size: 21px; }
  .seg button { padding: 7px 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .cell, .tool, .key { transition: background-color .12s ease; }
}
</style>

<!-- Game screen: header, difficulty, board, tools, number pad -->
<main class="app">
  <div class="top">
    <h1>Nine by Nine</h1>
    <div class="stats" aria-live="off">
      <span id="timer-wrap"><b id="timer">0:00</b></span>
      <span id="miss-wrap">Mistakes <b id="miss">0/3</b></span>
    </div>
  </div>

  <div class="bar">
    <div class="seg" role="radiogroup" aria-label="Difficulty">
      <button type="button" id="lv-easy" role="radio" data-level="easy" aria-checked="false">Easy</button>
      <button type="button" id="lv-medium" role="radio" data-level="medium" aria-checked="true">Medium</button>
      <button type="button" id="lv-hard" role="radio" data-level="hard" aria-checked="false">Hard</button>
    </div>
    <button type="button" class="ghost" id="new-game">New game</button>
  </div>

  <div class="board" id="board" role="group" aria-label="Sudoku board"></div>

  <div class="tools">
    <button type="button" class="tool" id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
    <button type="button" class="tool" id="erase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H9l-5-5a2 2 0 0 1 0-3l9-9a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 9"/><path d="M7 11l6 6"/></svg>Erase</button>
    <button type="button" class="tool" id="notes" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Notes<span class="badge" id="notes-badge">off</span></button>
    <button type="button" class="tool" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg>Hint<span class="badge" id="hint-badge">3</span></button>
  </div>

  <div class="pad" id="pad"></div>

  <p class="help">Keyboard: <kbd>1</kbd>–<kbd>9</kbd> enter, <kbd>N</kbd> notes, <kbd>⌫</kbd> erase, arrows move, <kbd>H</kbd> hint, <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo.</p>
</main>

<!-- Dialog used for win, game over and "start a new game?" confirmation (filled in by the script) -->
<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <h2 id="ov-title"></h2>
    <p id="ov-text"></p>
    <div class="facts" id="ov-facts"></div>
    <button type="button" class="go" id="ov-primary"></button>
    <button type="button" class="go alt" id="ov-secondary"></button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     SETTINGS
     ===================================================================== */

  // Bumped from v1 because the saved-game format changed with the renaming.
  const STORAGE_KEY = 'nine-by-nine-v2';
  const CELL_COUNT = 81;
  const MAX_MISTAKES = 3;
  const MAX_HINTS = 3;

  // How many numbers are pre-filled ("clues") at each difficulty. Fewer clues = harder.
  const CLUES_BY_LEVEL = { easy: 40, medium: 32, hard: 26 };
  const LEVEL_LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

  // Removing clues one by one can take a while; stop after this long and keep what we have.
  const MAX_GENERATION_MS = 1500;

  /* =====================================================================
     BOARD GEOMETRY
     Cells are numbered 0..80, left to right, top to bottom:
       row = floor(cell / 9), column = cell % 9
     A "box" is one of the nine 3x3 blocks, numbered 0..8 in the same order.
     ===================================================================== */

  const boxIndexOfCell = [];  // boxIndexOfCell[cell] -> which 3x3 box the cell is in
  const peerCellsOf = [];     // peerCellsOf[cell]    -> the 20 cells sharing its row, column or box

  for (let cell = 0; cell < CELL_COUNT; cell++) {
    const row = Math.floor(cell / 9);
    const column = cell % 9;
    boxIndexOfCell.push(Math.floor(row / 3) * 3 + Math.floor(column / 3));
  }

  for (let cell = 0; cell < CELL_COUNT; cell++) {
    const peers = [];
    for (let other = 0; other < CELL_COUNT; other++) {
      if (other === cell) continue;
      const sameRow = Math.floor(cell / 9) === Math.floor(other / 9);
      const sameColumn = cell % 9 === other % 9;
      const sameBox = boxIndexOfCell[cell] === boxIndexOfCell[other];
      if (sameRow || sameColumn || sameBox) peers.push(other);
    }
    peerCellsOf.push(peers);
  }

  // Fisher-Yates shuffle: puts the array in random order (changes the array itself).
  function shuffleInPlace(items) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const swap = items[i];
      items[i] = items[j];
      items[j] = swap;
    }
    return items;
  }

  /* =====================================================================
     PUZZLE GENERATION
     1. Fill a complete valid grid using a randomised solver.
     2. Remove numbers one at a time, but only keep a removal if the puzzle
        still has exactly one solution.
     ===================================================================== */

  /*
    Backtracking solver.

    `grid` is an array of 81 digits, with 0 meaning empty.
    The solver tracks which digits are already used in each row, column and
    box as bitmasks: digit d is stored as bit (d - 1), so 1 -> 0b000000001
    and 9 -> 0b100000000.

    It always fills the empty cell with the fewest possible digits first,
    which keeps the search very small.

    It stops once it has found `solutionLimit` solutions. Passing 2 is
    enough to answer "is this solution unique?".
    With `randomizeOrder` it tries digits in random order, which is how we
    create a random complete grid from an empty one.

    Returns how many solutions it found and a copy of the first one.
  */
  function solveGrid(grid, solutionLimit, randomizeOrder) {
    const rowDigitMasks = new Array(9).fill(0);
    const columnDigitMasks = new Array(9).fill(0);
    const boxDigitMasks = new Array(9).fill(0);
    const workingGrid = grid.slice(); // never modify the caller's grid
    let solutionCount = 0;
    let firstSolution = null;

    // Record the digits that are already on the board.
    for (let cell = 0; cell < CELL_COUNT; cell++) {
      const digit = workingGrid[cell];
      if (digit) {
        const digitBit = 1 << (digit - 1);
        rowDigitMasks[Math.floor(cell / 9)] |= digitBit;
        columnDigitMasks[cell % 9] |= digitBit;
        boxDigitMasks[boxIndexOfCell[cell]] |= digitBit;
      }
    }

    function search() {
      // Step 1: find the empty cell with the fewest candidate digits.
      let bestCell = -1;
      let bestCandidates = 0;     // bitmask of digits that fit in bestCell
      let bestCandidateCount = 10;

      for (let cell = 0; cell < CELL_COUNT; cell++) {
        if (workingGrid[cell]) continue;
        const usedDigits = rowDigitMasks[Math.floor(cell / 9)] | columnDigitMasks[cell % 9] | boxDigitMasks[boxIndexOfCell[cell]];
        const candidates = ~usedDigits & 0b111111111;

        // Count the set bits in `candidates`.
        let candidateCount = 0;
        let remaining = candidates;
        while (remaining) {
          remaining &= remaining - 1; // clears the lowest set bit
          candidateCount++;
        }

        if (candidateCount < bestCandidateCount) {
          bestCandidateCount = candidateCount;
          bestCell = cell;
          bestCandidates = candidates;
          if (candidateCount <= 1) break; // can't do better than 0 or 1
        }
      }

      // Step 2: no empty cell left means the grid is solved.
      if (bestCell < 0) {
        solutionCount++;
        if (!firstSolution) firstSolution = workingGrid.slice();
        return;
      }

      // An empty cell with no candidates is a dead end: go back and try something else.
      if (bestCandidateCount === 0) return;

      // Step 3: try each candidate digit in the chosen cell.
      const digitsToTry = [];
      for (let digitIndex = 0; digitIndex < 9; digitIndex++) {
        if (bestCandidates & (1 << digitIndex)) digitsToTry.push(digitIndex);
      }
      if (randomizeOrder) shuffleInPlace(digitsToTry);

      const row = Math.floor(bestCell / 9);
      const column = bestCell % 9;
      const box = boxIndexOfCell[bestCell];

      for (const digitIndex of digitsToTry) {
        const digitBit = 1 << digitIndex;

        // Place the digit and mark it as used...
        workingGrid[bestCell] = digitIndex + 1;
        rowDigitMasks[row] |= digitBit;
        columnDigitMasks[column] |= digitBit;
        boxDigitMasks[box] |= digitBit;

        search(); // ...then solve the rest of the grid.

        // Undo the placement before trying the next digit.
        workingGrid[bestCell] = 0;
        rowDigitMasks[row] &= ~digitBit;
        columnDigitMasks[column] &= ~digitBit;
        boxDigitMasks[box] &= ~digitBit;

        if (solutionCount >= solutionLimit) return;
      }
    }

    search();
    return { solutionCount, firstSolution };
  }

  // Builds a puzzle for the given level. Returns the puzzle (with blanks) and its solution.
  function generatePuzzle(level) {
    const emptyGrid = new Array(CELL_COUNT).fill(0);
    const solvedGrid = solveGrid(emptyGrid, 1, true).firstSolution;

    const puzzleGrid = solvedGrid.slice();
    const removalOrder = shuffleInPlace(emptyGrid.map((_, cell) => cell));
    const targetClues = CLUES_BY_LEVEL[level];
    let clueCount = CELL_COUNT;
    const startedAt = Date.now();

    for (const cell of removalOrder) {
      if (clueCount <= targetClues) break;
      if (Date.now() - startedAt > MAX_GENERATION_MS) break;

      const removedDigit = puzzleGrid[cell];
      puzzleGrid[cell] = 0;

      // Keep the removal only if exactly one solution remains.
      if (solveGrid(puzzleGrid, 2, false).solutionCount === 1) {
        clueCount--;
      } else {
        puzzleGrid[cell] = removedDigit; // put it back
      }
    }
    return { givenDigits: puzzleGrid, solvedDigits: solvedGrid };
  }

  /* =====================================================================
     GAME STATE
     ===================================================================== */

  /*
    `game` holds everything needed to draw the board and to save it:
      level            'easy' | 'medium' | 'hard'
      givenDigits      the puzzle as generated (0 = empty). Never changes.
      solvedDigits     the unique solution. Used to detect wrong numbers.
      currentDigits    what is on the board now (givens + the player's entries)
      pencilNoteMasks  per cell, a bitmask of pencil-mark digits (bit d-1 = digit d)
      mistakeCount, hintsUsed, elapsedSeconds
      selectedCell     0..80, or -1 for none
      isNotesMode      true when number buttons toggle pencil marks
      isSolved         the puzzle is complete
      isOutOfMistakes  the player used up all their mistakes
  */
  let game = null;

  // Snapshots of the board taken before each move, so Undo can step back.
  let undoStack = [];

  function createGame(level, puzzle) {
    return {
      level: level,
      givenDigits: puzzle.givenDigits,
      solvedDigits: puzzle.solvedDigits,
      currentDigits: puzzle.givenDigits.slice(),
      pencilNoteMasks: new Array(CELL_COUNT).fill(0),
      mistakeCount: 0,
      hintsUsed: 0,
      elapsedSeconds: 0,
      selectedCell: -1,
      isNotesMode: false,
      isSolved: false,
      isOutOfMistakes: false
    };
  }

  // First cell that does not yet hold its correct digit. Used as the starting selection.
  function firstUnsolvedCell() {
    for (let cell = 0; cell < CELL_COUNT; cell++) {
      if (game.currentDigits[cell] !== game.solvedDigits[cell]) return cell;
    }
    return 0;
  }

  // The game ends when it is solved or the mistakes are used up. Input is locked then.
  function isGameFinished() {
    return game.isSolved || game.isOutOfMistakes;
  }

  /* ---------- Saving to the browser ---------- */
  // Storage can be blocked (private windows etc.), so every access is wrapped in try/catch.

  function saveGame() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(game)); } catch (error) { /* ignore */ }
  }

  // Returns a previously saved, unfinished game, or null if there is none or it looks damaged.
  function loadSavedGame() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      if (!saved || !CLUES_BY_LEVEL[saved.level]) return null;

      const listsAreValid = ['givenDigits', 'solvedDigits', 'currentDigits', 'pencilNoteMasks']
        .every(name => Array.isArray(saved[name]) && saved[name].length === CELL_COUNT);
      if (!listsAreValid || saved.isSolved) return null;
      return saved;
    } catch (error) {
      return null;
    }
  }

  /* =====================================================================
     PAGE ELEMENTS
     ===================================================================== */

  const boardElement = document.getElementById('board');
  const numberPadElement = document.getElementById('pad');
  const overlayElement = document.getElementById('overlay');

  const cellButtons = [];          // the 81 board buttons
  const cellValueElements = [];    // the big digit inside each cell
  const cellNoteElements = [];     // for each cell, its nine small pencil-mark digits
  const padKeyButtons = [];        // buttons 1-9 under the board
  const padKeyCountLabels = [];    // the "how many left" label on each pad button

  // Builds the 81 cells and the 9 number buttons once. After that we only update them.
  (function buildBoardAndPad() {
    for (let cell = 0; cell < CELL_COUNT; cell++) {
      const row = Math.floor(cell / 9);
      const column = cell % 9;

      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.cell = cell;

      // Class names add the thicker lines between the 3x3 boxes (see the CSS).
      // `cr`/`cb` = thick right/bottom edge, `ce`/`be` = no edge on the last column/row.
      button.className = 'cell'
        + (column % 3 === 2 && column < 8 ? ' cr' : '')
        + (row % 3 === 2 && row < 8 ? ' cb' : '')
        + (column === 8 ? ' ce' : '')
        + (row === 8 ? ' be' : '');

      // One big digit plus a 3x3 grid of small pencil marks.
      let markup = '<span class="v"></span><span class="nt">';
      for (let digit = 1; digit <= 9; digit++) markup += '<i>' + digit + '</i>';
      button.innerHTML = markup + '</span>';

      boardElement.appendChild(button);
      cellButtons.push(button);
      cellValueElements.push(button.firstChild);
      cellNoteElements.push(Array.from(button.lastChild.children));
    }

    for (let digit = 1; digit <= 9; digit++) {
      const key = document.createElement('button');
      key.type = 'button';
      key.className = 'key';
      key.dataset.digit = digit;
      key.setAttribute('aria-label', 'Enter ' + digit);
      key.innerHTML = '<span class="d">' + digit + '</span><span class="n"></span>';
      numberPadElement.appendChild(key);
      padKeyButtons.push(key);
      padKeyCountLabels.push(key.lastChild);
    }
  })();

  // 75 seconds -> "1:15"
  function formatTime(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
  }

  /* =====================================================================
     DRAWING
     renderGame() makes the page match the `game` object. It is called after
     every change, so the rest of the code never edits the display directly.
     ===================================================================== */

  function renderGame() {
    const selectedCell = game.selectedCell;
    const selectedDigit = selectedCell >= 0 ? game.currentDigits[selectedCell] : 0;
    const selectedPeers = selectedCell >= 0 ? peerCellsOf[selectedCell] : [];
    const correctDigitCounts = new Array(10).fill(0); // index = digit 1..9

    for (let cell = 0; cell < CELL_COUNT; cell++) {
      const digit = game.currentDigits[cell];
      const button = cellButtons[cell];
      const isGiven = game.givenDigits[cell] !== 0;
      const isWrong = digit !== 0 && digit !== game.solvedDigits[cell];

      if (digit && !isWrong) correctDigitCounts[digit]++;

      // Classes decide colours: player digit, wrong digit, selection, highlights.
      button.classList.toggle('user', !isGiven && digit !== 0);
      button.classList.toggle('bad', isWrong);
      button.classList.toggle('hasv', digit !== 0);
      button.classList.toggle('sel', cell === selectedCell);
      button.classList.toggle('peer', selectedCell >= 0 && cell !== selectedCell && selectedPeers.includes(cell));
      button.classList.toggle('same', selectedDigit !== 0 && digit === selectedDigit && cell !== selectedCell);

      cellValueElements[cell].textContent = digit ? digit : '';

      // Show pencil marks only on empty cells.
      if (!digit) {
        for (let digitIndex = 0; digitIndex < 9; digitIndex++) {
          const markIsSet = (game.pencilNoteMasks[cell] & (1 << digitIndex)) !== 0;
          cellNoteElements[cell][digitIndex].classList.toggle('on', markIsSet);
        }
      }

      button.setAttribute('aria-label',
        'Row ' + (Math.floor(cell / 9) + 1) + ', column ' + (cell % 9 + 1) + ', '
        + (digit ? (isGiven ? 'given ' : '') + digit : 'empty'));
    }

    // Number pad: show how many of each digit are still missing, and disable finished digits.
    for (let digit = 1; digit <= 9; digit++) {
      const remaining = 9 - correctDigitCounts[digit];
      padKeyCountLabels[digit - 1].textContent = remaining > 0 ? remaining : '';
      padKeyButtons[digit - 1].disabled = remaining <= 0;
    }

    // Header and tool buttons.
    document.getElementById('timer').textContent = formatTime(game.elapsedSeconds);
    document.getElementById('miss').textContent = game.mistakeCount + '/' + MAX_MISTAKES;
    document.getElementById('miss-wrap').className = game.mistakeCount > 0 ? 'warn' : '';

    document.getElementById('notes').setAttribute('aria-pressed', game.isNotesMode ? 'true' : 'false');
    document.getElementById('notes-badge').textContent = game.isNotesMode ? 'on' : 'off';

    const hintsLeft = MAX_HINTS - game.hintsUsed;
    document.getElementById('hint-badge').textContent = hintsLeft;
    document.getElementById('hint').disabled = hintsLeft <= 0;
    document.getElementById('undo').disabled = undoStack.length === 0;

    // Difficulty switch: mark the current level.
    ['easy', 'medium', 'hard'].forEach(function (level) {
      document.getElementById('lv-' + level).setAttribute('aria-checked', game.level === level ? 'true' : 'false');
    });
  }

  /* =====================================================================
     PLAYER ACTIONS
     ===================================================================== */

  // Saves a snapshot of the board so the next change can be undone.
  function rememberStateForUndo() {
    undoStack.push({
      digits: game.currentDigits.slice(),
      noteMasks: game.pencilNoteMasks.slice()
    });
    if (undoStack.length > 200) undoStack.shift(); // keep memory bounded
  }

  // After a correct digit is placed, that digit can no longer be a candidate in any peer cell.
  function removeNoteFromPeers(cell, digit) {
    const digitBitCleared = ~(1 << (digit - 1));
    for (const peer of peerCellsOf[cell]) game.pencilNoteMasks[peer] &= digitBitCleared;
  }

  // Runs after every move: checks for a win or a loss, saves, and redraws.
  function afterMove() {
    const puzzleIsComplete = game.currentDigits.every((digit, cell) => digit === game.solvedDigits[cell]);

    if (puzzleIsComplete) {
      game.isSolved = true;
      showEndDialog(true);
    } else if (game.mistakeCount >= MAX_MISTAKES) {
      game.isOutOfMistakes = true;
      showEndDialog(false);
    }
    saveGame();
    renderGame();
  }

  // The player pressed a digit (number pad or keyboard).
  function enterDigit(digit) {
    if (isGameFinished()) return;
    const cell = game.selectedCell;
    if (cell < 0 || game.givenDigits[cell]) return; // nothing selected, or a locked starting number

    const existingDigit = game.currentDigits[cell];
    if (existingDigit && existingDigit === game.solvedDigits[cell]) return; // correct answers are locked

    if (game.isNotesMode) {
      // Notes mode: flip this digit's pencil mark on or off (XOR toggles one bit).
      if (existingDigit) return; // marks only go in empty cells
      rememberStateForUndo();
      game.pencilNoteMasks[cell] ^= (1 << (digit - 1));
    } else {
      if (existingDigit === digit) return; // same wrong digit again: nothing to do
      rememberStateForUndo();
      game.currentDigits[cell] = digit;
      game.pencilNoteMasks[cell] = 0; // a placed digit replaces any pencil marks

      if (digit !== game.solvedDigits[cell]) {
        game.mistakeCount++; // wrong digit: it stays on the board in red until erased
      } else {
        removeNoteFromPeers(cell, digit);
      }
    }
    afterMove();
  }

  // Clears a wrong digit and/or the pencil marks from the selected cell.
  function eraseSelectedCell() {
    if (isGameFinished()) return;
    const cell = game.selectedCell;
    if (cell < 0 || game.givenDigits[cell]) return;

    const existingDigit = game.currentDigits[cell];
    if (existingDigit && existingDigit === game.solvedDigits[cell]) return; // correct answers stay
    if (!existingDigit && !game.pencilNoteMasks[cell]) return;              // already empty

    rememberStateForUndo();
    game.currentDigits[cell] = 0;
    game.pencilNoteMasks[cell] = 0;
    saveGame();
    renderGame();
  }

  // Restores the board to how it was before the last move. (Mistakes already counted stay counted.)
  function undoLastMove() {
    if (isGameFinished() || undoStack.length === 0) return;
    const snapshot = undoStack.pop();
    game.currentDigits = snapshot.digits;
    game.pencilNoteMasks = snapshot.noteMasks;
    saveGame();
    renderGame();
  }

  // Reveals the correct digit for the selected cell, or for a random unsolved cell
  // if nothing useful is selected.
  function giveHint() {
    if (isGameFinished() || game.hintsUsed >= MAX_HINTS) return;

    let targetCell = game.selectedCell;
    const selectionIsUseless = targetCell < 0
      || game.givenDigits[targetCell]
      || game.currentDigits[targetCell] === game.solvedDigits[targetCell];

    if (selectionIsUseless) {
      const unsolvedCells = [];
      for (let cell = 0; cell < CELL_COUNT; cell++) {
        if (game.currentDigits[cell] !== game.solvedDigits[cell]) unsolvedCells.push(cell);
      }
      if (unsolvedCells.length === 0) return;
      targetCell = unsolvedCells[Math.floor(Math.random() * unsolvedCells.length)];
    }

    rememberStateForUndo();
    game.currentDigits[targetCell] = game.solvedDigits[targetCell];
    game.pencilNoteMasks[targetCell] = 0;
    removeNoteFromPeers(targetCell, game.solvedDigits[targetCell]);
    game.hintsUsed++;
    game.selectedCell = targetCell;
    afterMove();
  }

  // Arrow keys: move the selection one cell, stopping at the board edges.
  function moveSelection(rowChange, columnChange) {
    if (game.selectedCell < 0) {
      game.selectedCell = firstUnsolvedCell();
      renderGame();
      return;
    }
    const row = Math.max(0, Math.min(8, Math.floor(game.selectedCell / 9) + rowChange));
    const column = Math.max(0, Math.min(8, game.selectedCell % 9 + columnChange));
    game.selectedCell = row * 9 + column;
    renderGame();
  }

  // Generates a puzzle and starts playing it. The short timeout lets the browser
  // update the page before the (brief) generation work begins.
  function startNewGame(level) {
    boardElement.setAttribute('aria-busy', 'true');
    setTimeout(function () {
      game = createGame(level, generatePuzzle(level));
      game.selectedCell = firstUnsolvedCell();
      undoStack = [];
      hideOverlay();
      boardElement.removeAttribute('aria-busy');
      saveGame();
      renderGame();
    }, 30);
  }

  // Same puzzle, back to the starting position (used after running out of mistakes).
  function restartSamePuzzle() {
    game = createGame(game.level, { givenDigits: game.givenDigits, solvedDigits: game.solvedDigits });
    game.selectedCell = firstUnsolvedCell();
    undoStack = [];
    hideOverlay();
    saveGame();
    renderGame();
  }

  /* =====================================================================
     DIALOGS
     One overlay element is reused for two purposes:
       'end'     - shown when the puzzle is solved or mistakes run out
       'confirm' - shown before throwing away a game in progress
     ===================================================================== */

  function hideOverlay() {
    overlayElement.hidden = true;
  }

  function showEndDialog(playerWon) {
    overlayElement.dataset.mode = 'end';
    document.getElementById('ov-title').textContent = playerWon ? 'Solved' : 'Out of mistakes';
    document.getElementById('ov-text').textContent = playerWon
      ? LEVEL_LABEL[game.level] + ' puzzle complete.'
      : 'Three wrong numbers ends the round. Try the same puzzle again or start a new one.';

    // Summary tiles: time, mistakes, hints.
    const factsElement = document.getElementById('ov-facts');
    factsElement.hidden = false;
    factsElement.innerHTML = '';
    [[formatTime(game.elapsedSeconds), 'time'], [game.mistakeCount, 'mistakes'], [game.hintsUsed, 'hints']]
      .forEach(function (fact) {
        const tile = document.createElement('div');
        const value = document.createElement('b');
        const label = document.createElement('span');
        value.textContent = fact[0];
        label.textContent = fact[1];
        tile.appendChild(value);
        tile.appendChild(label);
        factsElement.appendChild(tile);
      });

    const primaryButton = document.getElementById('ov-primary');
    const secondaryButton = document.getElementById('ov-secondary');
    if (playerWon) {
      primaryButton.textContent = 'New ' + LEVEL_LABEL[game.level].toLowerCase() + ' game';
      primaryButton.onclick = function () { startNewGame(game.level); };
      secondaryButton.hidden = true;
    } else {
      primaryButton.textContent = 'Try again';
      primaryButton.onclick = restartSamePuzzle;
      secondaryButton.hidden = false;
      secondaryButton.textContent = 'New game';
      secondaryButton.onclick = function () { startNewGame(game.level); };
    }
    overlayElement.hidden = false;
    primaryButton.focus();
  }

  // True if the player has entered anything beyond the starting numbers.
  function hasUnsavedProgress() {
    if (isGameFinished()) return false;
    for (let cell = 0; cell < CELL_COUNT; cell++) {
      if (game.currentDigits[cell] !== game.givenDigits[cell]) return true;
    }
    return false;
  }

  // Used by "New game" and the difficulty switch: asks first if progress would be lost.
  function requestNewGame(level) {
    if (!hasUnsavedProgress()) {
      startNewGame(level);
      return;
    }
    overlayElement.dataset.mode = 'confirm';
    document.getElementById('ov-title').textContent = 'Start a new game?';
    document.getElementById('ov-text').textContent = 'You will lose your progress on this puzzle.'
      + (level !== game.level ? ' The new puzzle will be ' + LEVEL_LABEL[level] + '.' : '');
    document.getElementById('ov-facts').hidden = true;

    const primaryButton = document.getElementById('ov-primary');
    const secondaryButton = document.getElementById('ov-secondary');
    primaryButton.textContent = 'Start new game';
    primaryButton.onclick = function () { startNewGame(level); };
    secondaryButton.hidden = false;
    secondaryButton.textContent = 'Keep playing';
    secondaryButton.onclick = hideOverlay;

    overlayElement.hidden = false;
    secondaryButton.focus(); // the safe choice gets focus so a stray Enter keeps the game
  }

  /* =====================================================================
     EVENT HANDLERS
     ===================================================================== */

  // Tapping a cell selects it. One listener on the board handles all 81 cells.
  boardElement.addEventListener('click', function (event) {
    const button = event.target.closest('.cell');
    if (!button) return;
    game.selectedCell = Number(button.dataset.cell);
    renderGame();
  });

  // Number pad.
  numberPadElement.addEventListener('click', function (event) {
    const key = event.target.closest('.key');
    if (key) enterDigit(Number(key.dataset.digit));
  });

  // Tool buttons.
  document.getElementById('undo').addEventListener('click', undoLastMove);
  document.getElementById('erase').addEventListener('click', eraseSelectedCell);
  document.getElementById('hint').addEventListener('click', giveHint);
  document.getElementById('notes').addEventListener('click', function () {
    game.isNotesMode = !game.isNotesMode;
    renderGame();
  });

  // New game and difficulty buttons go through the confirmation check.
  document.getElementById('new-game').addEventListener('click', function () {
    requestNewGame(game.level);
  });
  document.querySelectorAll('.seg button').forEach(function (button) {
    button.addEventListener('click', function () {
      if (button.dataset.level !== game.level) requestNewGame(button.dataset.level);
    });
  });

  // Tapping the dark area around the confirmation box closes it.
  overlayElement.addEventListener('click', function (event) {
    if (event.target === overlayElement && overlayElement.dataset.mode === 'confirm') hideOverlay();
  });

  // Keyboard support.
  document.addEventListener('keydown', function (event) {
    // While a dialog is open, the only key we handle is Escape (to dismiss the confirmation).
    if (!overlayElement.hidden) {
      if (event.key === 'Escape' && overlayElement.dataset.mode === 'confirm') hideOverlay();
      return;
    }
    if (event.altKey || event.metaKey) return;

    const key = event.key;
    if (key >= '1' && key <= '9') { enterDigit(Number(key)); event.preventDefault(); }
    else if (key === 'Backspace' || key === 'Delete' || key === '0') { eraseSelectedCell(); event.preventDefault(); }
    else if (key === 'ArrowUp') { moveSelection(-1, 0); event.preventDefault(); }
    else if (key === 'ArrowDown') { moveSelection(1, 0); event.preventDefault(); }
    else if (key === 'ArrowLeft') { moveSelection(0, -1); event.preventDefault(); }
    else if (key === 'ArrowRight') { moveSelection(0, 1); event.preventDefault(); }
    else if ((key === 'z' || key === 'Z') && event.ctrlKey) { undoLastMove(); event.preventDefault(); }
    else if (!event.ctrlKey && (key === 'n' || key === 'N')) { game.isNotesMode = !game.isNotesMode; renderGame(); }
    else if (!event.ctrlKey && (key === 'h' || key === 'H')) { giveHint(); }
  });

  // Timer: counts one second at a time while a game is in progress and the tab is visible.
  setInterval(function () {
    if (!game || isGameFinished() || document.hidden) return;
    game.elapsedSeconds++;
    document.getElementById('timer').textContent = formatTime(game.elapsedSeconds);
    if (game.elapsedSeconds % 5 === 0) saveGame(); // save the clock every few seconds
  }, 1000);

  /* =====================================================================
     START UP
     Resume the saved game if there is one, otherwise start a Medium game.
     ===================================================================== */

  const savedGame = loadSavedGame();
  if (savedGame) {
    game = savedGame;
    if (game.selectedCell < 0 || game.selectedCell >= CELL_COUNT) game.selectedCell = firstUnsolvedCell();
    undoStack = []; // undo history is not saved
    renderGame();
  } else {
    game = createGame('medium', generatePuzzle('medium'));
    game.selectedCell = firstUnsolvedCell();
    renderGame();
    saveGame();
  }
})();
</script>

</body></html>
