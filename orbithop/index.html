<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orbit Hop</title>
<style>
/* Layout: full-bleed canvas game. Polar world around a planet; ship fixed low on screen, world turns around it. */
:root{
  --space:#060818;
  --ink:#eaf0ff;
  --teal:#5ef2d0;
  --hot:#ff5f7e;
  --amber:#ffc857;
  --ice:#9be7ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--space);color:var(--ink);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--space)}
/* Invisible probe: its padding equals the phone's top safe-area inset, so the canvas HUD can read it. */
#safe-area-probe{position:fixed;top:0;left:0;width:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden}
</style>
<canvas id="game-canvas" aria-label="Orbit Hop game: tap to hop toward the planet, swipe to slide or hop back out"></canvas>
<div id="safe-area-probe"></div>
<!--
  ORBIT HOP
  How the world works:
    - A planet sits at the centre of concentric circular orbits. Everything is stored as
      polar coordinates (orbit radius + angle). The camera rotates the world so the ship
      always appears at the same spot low on the screen.
    - The screen is 400 logical units wide, so sizes look the same on every phone.

  Files load in this order (each one only uses things defined above it at start-up):
    js/utils.js                    math helpers
    js/config.js                   fixed numbers and tuning tables
    js/layout.js                   canvas and screen sizing
    js/assets/planet-styles.js     planet looks (data)
    js/assets/planet-art.js        planet painting
    js/assets/obstacle-art.js      one painter per obstacle type
    js/assets/ship-art.js          ship painting
    js/audio.js                    synthesised sounds
    js/world/orbits.js             orbit radii and obstacle placement
    js/world/planet-and-stars.js   planet surface blobs, star field
    js/state.js                    score, lives, level, ship, camera
    js/world/collision.js          hit tests and world-to-screen conversion
    js/effects.js                  particles, popups, banner
    js/game-flow.js                start, crash, respawn, hop and slide rules
    js/update.js                   per-frame simulation step
    js/render/helpers.js           canvas drawing helpers
    js/render/world.js             stars, orbits, obstacles, ship, particles
    js/render/hud.js               HUD and menu screens
    js/render/frame.js             draws one complete frame
    js/input.js                    touch and keyboard
    js/main.js                     start-up and game loop
-->
<script src="js/utils.js"></script>
<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script src="js/assets/planet-styles.js"></script>
<script src="js/assets/planet-art.js"></script>
<script src="js/assets/obstacle-art.js"></script>
<script src="js/assets/ship-art.js"></script>
<script src="js/audio.js"></script>
<script src="js/world/orbits.js"></script>
<script src="js/world/planet-and-stars.js"></script>
<script src="js/state.js"></script>
<script src="js/world/collision.js"></script>
<script src="js/effects.js"></script>
<script src="js/game-flow.js"></script>
<script src="js/update.js"></script>
<script src="js/render/helpers.js"></script>
<script src="js/render/world.js"></script>
<script src="js/render/hud.js"></script>
<script src="js/render/frame.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>

</body></html>
